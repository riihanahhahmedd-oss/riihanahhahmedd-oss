name: Update Codeforces Dashboard

on:
  push:
    branches:
      - main
      - profile-dashboard-redesign
    paths-ignore:
      - "assets/codeforces-stats.svg"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codeforces-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch Codeforces data and generate dashboard
        run: python scripts/update_codeforces_stats.py

      - name: Commit updated dashboard
        run: |
          if git diff --quiet; then
            echo "No Codeforces dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces-stats.svg
          git commit -m "chore: refresh Codeforces dashboard"
          git pull --rebase origin main
          git push
